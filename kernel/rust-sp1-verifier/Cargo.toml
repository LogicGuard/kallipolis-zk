[package]
name = "kallipolis-sp1-verifier"
version = "0.1.0"
edition = "2021"
description = "Kallipolis ZK Rust SP1 zkVM AggLayer State Transition & Merkle Verifier"
license = "MIT"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }
sha3 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false }

[features]
default = ["std"]
std = ["serde/std", "hex/std"]
