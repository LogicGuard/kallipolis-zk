global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "kallipolis-gateway"
    static_configs:
      - targets: ["gateway:3000"]

  - job_name: "kallipolis-actor-system"
    static_configs:
      - targets: ["actor-system:8080"]

  - job_name: "kallipolis-consensus-engine"
    static_configs:
      - targets: ["consensus-engine:8081"]

  - job_name: "kallipolis-event-bus"
    static_configs:
      - targets: ["event-bus:8082"]
