[package]
name = "kallipolis-event-bus"
version = "3.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
foundationdb = "0.9"
dashmap = "6.0"
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
prometheus = "0.13"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.13"
