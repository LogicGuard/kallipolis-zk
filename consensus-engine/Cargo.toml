[package]
name = "kallipolis-consensus-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full", "sync", "time"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"
once_cell = "1.19"
