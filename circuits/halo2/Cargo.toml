[package]
name = "polyguard-halo2-circuits"
version = "3.0.0"
edition = "2021"
description = "PolyGuard Plonkish Zero-Knowledge Circuits with Halo2"

[dependencies]
halo2_proofs = { version = "0.3", default-features = false, features = ["dev-graph"] }
halo2_curves = "0.1"
ff = "0.13"
pasta_curves = "0.5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"
futures = "0.3"
tokio = { version = "1.0", features = ["full"] }

[features]
default = ["std"]
std = ["halo2_proofs/std"]
