version: '3.8'

services:
  foundationdb:
    image: foundationdb/foundationdb:7.1.19
    ports:
      - "4500:4500"
    environment:
      - FDB_CLUSTER_FILE=/var/fdb/fdb.cluster
    env_file: .env

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    env_file: .env

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    env_file: .env

  actor-system:
    build:
      context: .
      dockerfile: actor-system/Dockerfile
    env_file: .env
    depends_on:
      - redis
      - foundationdb

  consensus-engine:
    build:
      context: .
      dockerfile: consensus-engine/Dockerfile
    env_file: .env
    depends_on:
      - redis
      - foundationdb

  event-bus:
    build:
      context: .
      dockerfile: event-bus/Dockerfile
    env_file: .env
    depends_on:
      - redis
