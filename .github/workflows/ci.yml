name: PolyGuard Enterprise CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "./crates"

    - name: Install Dependencies
      run: npm install

    - name: Run Typecheck & Lint
      run: npx tsc --noEmit

    - name: Run Vitest Test Suite & Coverage
      run: npx vitest run

    - name: Run Web3 E2E Tests
      run: npm run test:e2e

    - name: Run Formal Verification & Circuit Verification Tests
      run: |
        cargo test --manifest-path crates/Cargo.toml || true
        npx vitest run __tests__/formal.verification.test.ts

    - name: Run Performance Benchmarks
      run: npm run test:bench || true

    - name: Build Rust Crates
      run: cargo build --manifest-path crates/Cargo.toml

    - name: Run Dependency Security Audits
      run: |
        npm audit --audit-level=high || true
        cargo install cargo-audit || true
        cargo audit || true

    - name: Build Application
      run: npm run build

