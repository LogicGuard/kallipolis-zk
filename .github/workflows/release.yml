name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Prover Engine
        run: make build-prover
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*
