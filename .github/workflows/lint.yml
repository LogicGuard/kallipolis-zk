name: Linting

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run Clippy
        run: cargo clippy --manifest-path crates/Cargo.toml -- -D warnings || cargo clippy -- -D warnings || true
      - name: Run rustfmt
        run: cargo fmt --manifest-path crates/Cargo.toml -- --check || cargo fmt -- --check || true
